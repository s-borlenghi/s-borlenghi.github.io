<script>
  /*
   * Smistamento verso la versione in lingua.
   * Ordine di scelta: parametro ?lang=, scelta salvata dal visitatore, lingua del browser.
   * Tutto ciò che non è italiano va alla versione inglese.
   */
  (function () {
    var pick = new URLSearchParams(location.search).get("lang");
    if (!pick) { try { pick = localStorage.getItem("lang"); } catch (e) {} }
    if (!pick) {
      var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
      pick = String(langs[0]).toLowerCase().indexOf("it") === 0 ? "it" : "en";
    }
    location.replace((pick === "en" ? "en/" : "it/") + location.hash);
  })();
</script>
